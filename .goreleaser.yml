# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=jcroql
version: 2

project_name: pmoves-crush

includes:
  - from_url:
      url: charmbracelet/meta/main/notarize.yaml

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
  license: "FSL-1.1-MIT"
  homepage: "https://github.com/POWERFULMOVES/PMOVES-crush"
  description: "PMOVES-Crush: A PMOVES-branded terminal AI assistant for the PMOVES.AI ecosystem."
  full_description: "PMOVES-Crush: A PMOVES-branded terminal AI assistant integrated with TensorZero, Hi-RAG, and the PMOVES.AI agent orchestration platform."
  maintainers:
    - "POWERFULMOVES <pmoves@powerfulmoves.ai>"

nightly:
  publish_release: true
  keep_single_release: true
  version_template: "{{ incminor .Version }}-nightly"

snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"

before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - rm -rf manpages
    - mkdir manpages
    - sh -c 'go run . completion bash >./completions/pmoves-crush.bash'
    - sh -c 'go run . completion zsh >./completions/pmoves-crush.zsh'
    - sh -c 'go run . completion fish >./completions/pmoves-crush.fish'
    - sh -c 'go run . man | gzip -c >./manpages/pmoves-crush.1.gz'

# gomod:
#   proxy: true

builds:
  - env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
      - android
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: android
        goarch: amd64
      - goos: android
        goarch: arm
      - goos: android
        goarch: "386"
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w -X github.com/charmbracelet/crush/internal/version.Version={{.Version}}
    flags:
      - -trimpath

archives:
  - name_template: >-
      pmoves-crush_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm}}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - manpages/*
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# AUR disabled for PMOVES fork - using GHCR instead
# aur_sources:
#   - private_key: "{{ .Env.AUR_KEY }}"
#     git_url: "ssh://aur@aur.archlinux.org/pmoves-crush.git"

# AUR bin disabled for PMOVES fork
# aurs: []

# Furies disabled for PMOVES fork
# furies: []

# Homebrew disabled for PMOVES fork - using GHCR
# brews: []

# Scoop disabled for PMOVES fork
# scoops: []

# NPM disabled for PMOVES fork
# npms: []

nfpms:
  - formats:
      - apk
      - deb
      - rpm
    file_name_template: "{{ .ConventionalFileName }}"
    contents:
      - src: ./completions/pmoves-crush.bash
        dst: /etc/bash_completion.d/pmoves-crush
      - src: ./completions/pmoves-crush.fish
        dst: /usr/share/fish/vendor_completions.d/pmoves-crush.fish
      - src: ./completions/pmoves-crush.zsh
        dst: /usr/share/zsh/site-functions/_pmoves-crush
      - src: ./manpages/pmoves-crush.1.gz
        dst: /usr/share/man/man1/pmoves-crush.1.gz

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

source:
  enabled: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

# Nix disabled for PMOVES fork
# nix: []

# Winget disabled for PMOVES fork
# winget: []

changelog:
  sort: asc
  disable: "{{ .IsNightly }}"
  use: github
  filters:
    exclude:
      - "^(build|ci): "
      - "^chore: auto-update generated files$"
      - "^chore: docs$"
      - "^chore: schema update$"
      - "^chore: schema$"
      - "^chore: typo$"
      - "^chore: update schema$"
      - "^chore: update$"
      - "^chore\\(legal\\): "
      - "^chore\\(deps\\): "
      - "^docs: update$"
      - "^test:"
      - "^test\\("
      - "^v\\d.*"
      - "merge conflict"
      - "merge conflict"
      - Merge branch
      - Merge pull request
      - Merge remote-tracking branch
      - go mod tidy
      - "^wip "
      - "^wip:"
  groups:
    - title: "Deps"
      regexp: "^.*\\(deps\\)*:+.*$"
      order: 300
    - title: "New!"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "Fixed"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "Docs"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: "Other stuff"
      order: 9999

release:
  prerelease: auto
  footer: |
    ---

    🤖 **PMOVES-Crush** - Part of the [PMOVES.AI](https://github.com/POWERFULMOVES/PMOVES.AI) ecosystem

    Built with ❤️ by POWERFULMOVES | Upstream: [Charm Bracelet Crush](https://github.com/charmbracelet/crush)
