name: nightly

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - id: check
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          if gh run list --workflow nightly.yml -c $(git rev-parse HEAD) -s success | grep 'completed'; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
  # PMOVES: inlined from charmbracelet/meta's nightly (which cannot init
  # submodules) and stripped of goreleaser: the fork has no GORELEASER_KEY,
  # so every goreleaser-based path (snapshot/nightly/release) fails at the
  # pro-license step — the 2026-08-05 snapshot run is the evidence. The
  # nightly SIGNAL is a cross-OS build of the tracked tip with the catwalk
  # replace active; publishing binaries is a separate decision for the
  # operator (see the release.yml guard).
  nightly:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PMOVES: the catwalk replace in go.mod points at this submodule;
      # every job that runs the go toolchain must init it first.
      - run: git submodule update --init pmoves-catwalk
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -failfast ./...
