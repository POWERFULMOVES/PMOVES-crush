name: goreleaser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# PMOVES: this fork does not cut goreleaser releases. The former delegation
# to charmbracelet/meta's goreleaser workflow could never run here: it
# requires goreleaser_key + docker secrets that are not configured, AND meta's
# workflow does not init submodules — with the catwalk replace active in
# go.mod, its `go mod tidy` would fail even if the secrets existed. The
# 2026-08-05 snapshot run is the standing evidence that goreleaser-pro fails
# on this fork (missing key). Publishing binaries from the fork is an open
# operator decision; when it is made, inline the job WITH
# `git submodule update --init pmoves-catwalk` after checkout.
jobs:
  not-configured:
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly rather than at a confusing goreleaser step
        run: |
          echo "::error::Release pipeline is not configured on this fork (no goreleaser/docker secrets, and meta's goreleaser workflow cannot init the pmoves-catwalk submodule the go.mod replace requires). Tagging is not supported until this is inlined — see the comment in this file."
          exit 1
