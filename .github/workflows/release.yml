name: goreleaser

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to publish GitHub Releases

concurrency:
  group: goreleaser
  cancel-in-progress: false

jobs:
  # PMOVES: inlined from charmbracelet/meta's goreleaser workflow, which could
  # never run on this fork: it requires goreleaser-pro + docker/registry
  # secrets that do not exist here, AND it does not init submodules — with the
  # catwalk replace active in go.mod its `go mod tidy` would fail even if the
  # secrets did. This inline version uses goreleaser OSS (no license key) and
  # publishes GitHub Release artifacts ONLY, per .goreleaser-pmoves.yml.
  # Tag pushes cut a real release; manual dispatch runs --snapshot and uploads
  # workflow artifacts so the pipeline is provable without tagging.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # PMOVES: the catwalk replace in go.mod points at this submodule;
      # every job that runs the go toolchain must init it first.
      - run: git submodule update --init pmoves-catwalk
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          distribution: goreleaser # OSS — goreleaser-pro needs a license key this fork does not have
          args: release --clean -f .goreleaser-pmoves.yml ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: crush-snapshot-dist
          path: dist/
          retention-days: 7
